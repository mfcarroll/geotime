name: Build Android Release

on:
  push:
    branches: ["main"] # Triggers when you push to main
  # Manual runs go to a testing track, so a branch can reach a phone as a
  # Play-signed build without shipping to everyone. Play re-signs uploads with
  # the app signing key, which is the only signature App Links verify against —
  # a debug or locally signed build can never prove them.
  workflow_dispatch:
    inputs:
      track:
        description: "Play track. Pushes to main always go to production."
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A choice input is never empty, so this cannot fall through to
      # production on a manual run.
      TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'production' }}

    steps:
      # Production is what merging to main does. Anywhere else, choosing it is
      # far more likely a slip than a decision, and it ships at 100%.
      - name: Refuse production from anywhere but main
        if: env.TRACK == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production releases come from main only; this run is on ${GITHUB_REF_NAME}."
          exit 1

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        # cap sync writes the key into the generated (untracked)
        # capacitor.config.json, which is how it reaches native.
        env:
          RCCL_APPKEY: ${{ secrets.RCCL_APPKEY }}
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Extract Version from package.json
        id: get_version
        run: echo "version=$(node -e "console.log(require('./package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Build Android App Bundle (AAB)
        working-directory: ./android
        run: ./gradlew bundleRelease -PbuildVersionCode=${{ github.run_number }} -PbuildVersionName=${{ steps.get_version.outputs.version }}

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{steps.sign_app.outputs.signedReleaseFile}}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON }}
          packageName: ca.matthewcarroll.geotime
          releaseFiles: ${{steps.sign_app.outputs.signedReleaseFile}}
          track: ${{ env.TRACK }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
