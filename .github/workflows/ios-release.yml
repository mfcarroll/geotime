name: Submit iOS Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit to App Store review (uncheck to prepare the version and stop, e.g. to add screenshots first)"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Prepare-only mode. The release script still waits for the build, creates
      # the App Store version, attaches the build and writes What's New — it just
      # stops before pressing Submit, leaving the version editable for screenshots
      # or other metadata. Ask for it either by unchecking the box on a manual run,
      # or by putting [no-submit] in the commit message of the push to main.
      - name: Decide whether to submit for review
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SUBMIT: ${{ inputs.submit }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "IOS_SUBMIT=$INPUT_SUBMIT"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qF '[no-submit]'; then
            echo "IOS_SUBMIT=false"
          else
            echo "IOS_SUBMIT=true"
          fi >> "$GITHUB_ENV"

      # Waits for Xcode Cloud (triggered by the same push) to upload and
      # process the build, then attaches it to an App Store version and — unless
      # IOS_SUBMIT says otherwise — submits for review with automatic release on
      # approval.
      - name: Prepare and submit the App Store version
        run: |
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "ASC_* secrets not configured; skipping App Store submission."
            exit 0
          fi
          # Shared release notes (same file Android uses for its "What's New").
          export RELEASE_NOTES="$(cat distribution/whatsnew/whatsnew-en-US)"
          node scripts/release-ios.mjs
