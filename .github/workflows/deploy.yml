# The web app at geotime.app, deployed to Cloudflare on every push to main.
#
# It used to be GitHub Pages. The site moved to a Worker (workers/web) so that
# one name could serve both the site and the follow links that open the app —
# geotime.app/f/<code> — which Pages could not do, since /f/ and /.well-known/
# have to be answered by code rather than by files.
name: Deploy the web app

on:
  push:
    branches: ['main']
  workflow_dispatch:

# One deploy at a time, and never cancel one half-way through.
concurrency:
  group: 'web'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Loudly, rather than skipping: a deploy that quietly did nothing would
      # leave the site on the previous release with no sign anything was wrong.
      - name: Check the Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Create one from the 'Edit Cloudflare Workers' template and add it as a repository secret."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config workers/web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
